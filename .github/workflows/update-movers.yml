name: Update curated market pulse
on:
  schedule:
    - cron: '8,28,48 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-market-movers
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch curated multi-asset quotes
        run: python scripts/update_movers.py
      - name: Fetch intraday radar candles (optional)
        run: python scripts/update_radar.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-movers.json market-radar.json
          git diff --cached --quiet || (git commit -m "chore: update market movers" && git pull --rebase && git push)
