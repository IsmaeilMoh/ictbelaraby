name: ICT Arabic - free periodic market research
on:
  push:
    branches: [main]
    paths:
      - 'monitor-service/**'
      - '.github/workflows/ict-free-market-monitor.yml'
  schedule:
    # Offset avoids the most congested minute-0 schedule, cadence best effort.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to ict-monitor-feed (leave off for a dry run)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ict-free-monitor-publish
  cancel-in-progress: false
jobs:
  market-research:
    # Keep the existing runner unless an approved runner with Bybit V5 access is configured.
    runs-on: ${{ vars.ICT_BYBIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scanner and safety checks
        working-directory: monitor-service
        run: |
          npm test
          npm run test:actions
      - name: Restore prior research-only state from publication branch
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/ict-monitor-feed:refs/remotes/origin/ict-monitor-feed' || true
          if git rev-parse --verify refs/remotes/origin/ict-monitor-feed >/dev/null 2>&1; then
            git show refs/remotes/origin/ict-monitor-feed:monitor-state.json > monitor-service/monitor-data.json || true
          fi
      - name: One-shot research scan (fail closed)
        env:
          ECONOMIC_FEED_URL: ${{ vars.ICT_ECONOMIC_FEED_URL }}
          MONITOR_TARGETS: crypto:BTCUSDT:15,crypto:BTCUSDT:5,crypto:ETHUSDT:15,crypto:ETHUSDT:5
          STORE_FILE: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && format('{0}/ict-bybit-{1}-{2}/state.json', runner.temp, github.run_id, github.run_attempt) || format('{0}/monitor-service/monitor-data.json', github.workspace) }}
          PUBLIC_OUTPUT_DIR: ${{ runner.temp }}/ict-monitor-publish
        run: node monitor-service/github-run-once.cjs
      - name: Verify Bybit candles without publishing
        shell: bash
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        env:
          PUBLIC_OUTPUT_DIR: ${{ runner.temp }}/ict-monitor-publish
        run: |
          node <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const status = require(path.join(process.env.PUBLIC_OUTPUT_DIR, 'monitor-status.json'));
          const expected = ['crypto:BTCUSDT:15','crypto:BTCUSDT:5','crypto:ETHUSDT:15','crypto:ETHUSDT:5'];
          assert.deepEqual(Object.keys(status.targets).sort(), expected.toSorted());
          assert.equal(status.readyForExecution, false);
          assert.equal(status.safety.executionApproved, false);
          const fresh = expected.filter(id => {
            const row = status.targets[id];
            console.log(id + ': ' + (row.reason || row.status) + ' · latest close ' + (row.lastCompleteAt || 'unavailable'));
            return row.status === 'research_data_valid' && !row.stale && row.hourlyContext?.status === 'ready';
          });
          assert.equal(fresh.length, expected.length, 'Fresh entry candles and hourly context required for all four targets');
          JS
      - name: Publish research-only status to dedicated branch
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLIC_OUTPUT_DIR: ${{ runner.temp }}/ict-monitor-publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ict-monitor-branch"
          cd "$RUNNER_TEMP/ict-monitor-branch"
          cp "$PUBLIC_OUTPUT_DIR/monitor-status.json" ./monitor-status.json
          cp "$GITHUB_WORKSPACE/monitor-service/monitor-data.json" ./monitor-state.json
          printf '%s\n' 'Research data only; never an executable trade recommendation.' > README.txt
          git init -q
          git checkout -q -b ict-monitor-feed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor-status.json monitor-state.json README.txt
          git commit -qm 'Refresh non-executable ICT research snapshot'
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          # Replaces one snapshot commit; does not write to the website's default branch.
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $basic" push --force origin HEAD:refs/heads/ict-monitor-feed
