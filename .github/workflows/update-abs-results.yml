name: Update official Australian CPI results
on:
  workflow_dispatch:
  schedule:
    - cron: '43 0,1,3 * * 1-5'
permissions:
  contents: write
concurrency:
  group: update-economic-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m unittest discover -s scripts -p 'test_abs_results.py'
      - run: python scripts/update_abs_results.py
      - name: Commit verified ABS data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add economic-abs.json
          git diff --cached --quiet || (git commit -m "data: refresh official Australian CPI observations" && git push)
