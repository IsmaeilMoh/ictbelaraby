name: Update public market xray
on:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-market-xray
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch historical daily market series
        run: python scripts/update_market_xray.py
      - name: Publish X-Ray feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-xray.json
          git diff --cached --quiet || (git commit -m "chore: update market xray" && git pull --rebase && git push)
