name: ICT decision center quality gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'monitor-service/**'
      - 'ict-monitor-auto-refresh-709.js'
      - 'ict-background-status-708c2.js'
      - '*.html'
      - 'ict-*.js'
      - 'scripts/**'
      - 'sw.js'
      - '.github/workflows/ict-center-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve IFVG research using licensed one-minute candles
        if: github.event_name == 'pull_request' && github.head_ref == 'dev/ifvg-minute-replay' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          IFVG_FINE_FRAME: '1'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node monitor-service/ifvg-finer-replay.cjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Refine displayed IFVG cases with same-provider five-minute candles
        if: github.event_name == 'pull_request' && github.head_ref == 'dev/ifvg-displayed-replay' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          IFVG_DISPLAYED: '1'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -o pipefail
          node monitor-service/ifvg-finer-replay.cjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Replay IFVG on a separate archived period
        if: github.event_name == 'pull_request' && (github.head_ref == 'dev/ifvg-independent-replay' || github.head_ref == 'dev/ict-prior-week-and-matched-replay' || github.head_ref == 'dev/ict-batch-results-filter' || github.head_ref == 'dev/ifvg-holdout-markets') && github.event.pull_request.head.repo.full_name == github.repository
        env:
          IFVG_DISPLAYED: '1'
          IFVG_INDEPENDENT: '1'
          IFVG_HOLDOUT: ${{ github.head_ref == 'dev/ifvg-holdout-markets' && '1' || '0' }}
          IFVG_EXTENDED: ${{ github.head_ref == 'dev/ict-batch-results-filter' && '1' || '0' }}
          IFVG_MATCHED: ${{ github.head_ref == 'dev/ict-prior-week-and-matched-replay' && '1' || '0' }}
          IFVG_FINE_FRAME: '1'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -o pipefail
          node monitor-service/ifvg-finer-replay.cjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare all four entry frames with point-in-time news and market context
        if: github.event_name == 'pull_request' && github.head_ref == 'dev/ict-continuation-research' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          git fetch --unshallow origin
          node monitor-service/ict-unseen-market-replay.cjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test monitor, safety gates and market data parsers
        working-directory: monitor-service
        run: npm test
      - name: Test publication safety and center integration
        working-directory: monitor-service
        run: npm run test:actions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python data parsers and static site references
        run: |
          python -m pip install requests beautifulsoup4
          python -m unittest discover -s scripts
          python scripts/qa_site.py
      - name: Probe public market sources without publishing
        if: github.event_name == 'pull_request'
        env:
          PUBLIC_OUTPUT_DIR: ${{ runner.temp }}/ict-live-probe
          STORE_FILE: ${{ runner.temp }}/ict-live-probe/state.json
        run: |
          node monitor-service/github-run-once.cjs
          node <<'JS'
          const stream = require('./ict-entry-stream.js');
          async function probe(market,symbol) {
            return new Promise(resolve=>{
              let client;
              const finish = message => { client?.close(); console.log('Public WebSocket',market,symbol,message); resolve(); };
              client = stream.connect(market,symbol,{quote:quote=>finish('fresh bid/ask '+new Date(quote.at).toISOString()),failed:finish});
              if(!client)finish('unavailable');
            });
          }
          probe('crypto','BTCUSDT').catch(error=>{
            console.error(error.message);
            process.exitCode=1;
          });
          JS
          node <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const status = require(path.join(process.env.PUBLIC_OUTPUT_DIR, 'monitor-status.json'));
          assert.deepEqual(Object.keys(status.targets).sort(), ['crypto:BTCUSDT:15','crypto:BTCUSDT:5','crypto:ETHUSDT:15','crypto:ETHUSDT:5'].sort());
          assert.equal(status.readyForExecution, false);
          assert.equal(status.safety.executionApproved, false);
          if (!status.marketDataReady) assert.equal(status.observations.length, 0);
          console.log('### Live public source probe');
          console.log(`Fresh research sources: ${status.marketSummary.valid}/${status.marketCount}`);
          for (const [id, target] of Object.entries(status.targets)) {
            const result = target.status === 'research_data_valid' && !target.stale ? target.source : (target.error || 'stale');
            console.log(`- ${id}: ${result}`);
          }
          const news = status.safety.economic;
          console.log(`- Economic calendar: ${news.ok ? news.eventCount + ' dated events received' : news.reason}`);
          console.log(`- Research observations: ${status.observations.length}. Execution approved: false.`);
          JS
      - name: Probe Biquote coverage from the GitHub Pages origin
        if: github.event_name == 'pull_request'
        run: |
          node <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          const api = require('./ict-public-markets-702c2.js');
          const origin = 'https://ismaeilmoh.github.io';
          async function fromPages(url, options) {
            const response = await fetch(url, {...options, headers: {...options.headers, Origin: origin}});
            if (!response.ok) return response;
            const cors = response.headers.get('access-control-allow-origin');
            if (cors !== '*' && cors !== origin) throw Error('CORS unavailable');
            return response;
          }
          const unavailable = result => result.status === 'rejected'
            ? 'unverified (' + (result.reason.cause?.code || result.reason.message) + ')'
            : 'unverified (no qualifying data)';
          async function probe() {
            console.log('### Biquote public source probe');
            try {
              const expanded = await api.loadCatalog({fetch: fromPages});
              for (const [group, items] of Object.entries(expanded))
                console.log(`- Catalog ${group}: ${items.length} symbols with quotes in the last 7 days`);
            } catch (error) {
              console.log('- Catalog unavailable: ' + (error.cause?.code || error.message));
              for (const path of ['symbols?quotedWithinDays=7','active','symbols?activeOnly=true']) {
                const sample = await fetch('https://biquote.io/api/'+path,{signal:AbortSignal.timeout(8000)}).then(r=>r.json()).catch(()=>null);
                console.log('Catalog diagnostic',path,Array.isArray(sample)?sample.length:typeof sample,JSON.stringify(Array.isArray(sample)?sample.slice(0,2):sample)?.slice(0,800));
              }
            }
            const instruments = Object.entries(api.MARKETS).flatMap(([market, rows]) => rows.map(([symbol]) => [market, symbol]));
            for (const [market, symbol] of instruments) {
              const instrument = api.resolve(market, symbol);
              const [candles, quote] = await Promise.allSettled([
                api.get(instrument, '15min', {fetch: fromPages, limit: 20}),
                api.getQuote(instrument, {fetch: fromPages})
              ]);
              const closed = candles.status === 'fulfilled' && candles.value.filter(bar => bar.confirmed).at(-1);
              const bars = closed ? new Date(closed.start + 900000).toISOString() : unavailable(candles);
              const book = quote.status === 'fulfilled' && quote.value ? 'fresh at ' + new Date(quote.value.at).toISOString() : unavailable(quote);
              console.log(`- ${symbol} (${instrument.providerSymbol}): last complete 15m close ${bars} | Bid/Ask ${book}`);
            }
          }
          probe().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
      - name: Verify prior-week references against public daily candles
        if: github.event_name == 'pull_request' && github.head_ref == 'dev/ict-prior-week-and-matched-replay'
        run: |
          node <<'JS'
          const context = require('./ict-context-engine-703a.js');
          const markets = require('./ict-public-markets-702c2.js');
          async function probe(group, symbol) {
            try {
              const candles = await markets.get(markets.resolve(group, symbol), '1day', {limit: 15});
              const week = context.priorProviderWeek(candles, Date.now(), group);
              console.log(symbol, 'PWH/PWL', week ? JSON.stringify({week:week.key, high:week.high, low:week.low}) : 'insufficient verified daily candles ' + JSON.stringify(candles.map(bar=>[new Date(bar.start).toISOString(), bar.confirmed])));
            } catch (error) {
              console.log(symbol, 'PWH/PWL unavailable:', error.cause?.code || error.message);
            }
          }
          Promise.all([probe('metals','XAUUSD'),probe('forex','EURUSD'),probe('stocks','AAPL')]);
          JS
      - name: Check parser against a published BEA release
        if: github.event_name == 'pull_request'
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from datetime import datetime, timezone
          import requests
          from update_bea_results import parse_release
          url = 'https://www.bea.gov/news/2026/personal-income-and-outlays-september-2026'
          response = requests.get(url, timeout=18)
          response.raise_for_status()
          result = parse_release(response.text, datetime(2026, 9, 1),
                                 datetime(2026, 10, 29, 12, 30, tzinfo=timezone.utc), url)
          assert result['actual'] == 0.3, result
          print('Verified archived September 2026 Core PCE monthly reading from BEA')
          PY
      - name: Probe the public Bybit perpetual catalog
        if: github.event_name == 'pull_request'
        run: |
          node <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          const bybit = require('./ict-live-feed-702a.js');
          bybit.fetchPerpetuals().then(contracts => {
            console.log('Bybit USDT crypto perpetual catalog:', contracts.length);
          }).catch(error => console.log('Bybit public catalog could not be verified from the runner:', error.message));
          JS

      - name: Check deployed opportunity center
        if: github.event_name == 'pull_request'
        run: |
          node <<'JS'
          const url = 'https://ismaeilmoh.github.io/ictbelaraby/decision-center.html';
          (async () => {
            const res = await fetch(url + '?probe=' + Date.now(), {signal: AbortSignal.timeout(12000)});
            if (!res.ok) throw Error('HTTP ' + res.status);
            const html = await res.text();
            const found = html.includes('ict-decision-console-708a.js?v=7.0.46-batch-filter');
            console.log('GitHub Pages batch-filter revision:', found ? 'verified' : 'not found');
          })().catch(error => console.log('GitHub Pages batch-filter revision unverified:', error.message));
          JS
