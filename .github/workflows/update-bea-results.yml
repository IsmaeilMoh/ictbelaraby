name: Update official BEA results
on:
  workflow_dispatch:
  schedule:
    - cron: '41,56 12,13 * * 1-5'
    - cron: '26 15,18,21 * * 1-5'
permissions:
  contents: write
concurrency:
  group: update-economic-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m unittest discover -s scripts -p 'test_bea_results.py'
      - run: python scripts/update_bea_results.py
      - run: python scripts/update_bea_gdp.py
      - name: Commit verified BEA data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add economic-bea.json economic-verified.json
          git diff --cached --quiet || (git commit -m "data: refresh official BEA observation" && git push)
