<style>
#opportunity-preview{--bg:#101a1d;--surface:#162427;--raised:#1b2b2e;--line:#344649;--ink:#f7f2e7;--muted:#b1c2c1;--gold:#ffc04c;--ict-accent:var(--gold);--ict-accent-contrast:#211808;--green:#9fe0c3;--radius:14px;font-size:16px;line-height:1.6;color:var(--ink);background:var(--bg);min-height:calc(100vh - 76px);
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
button,select,summary{cursor:pointer}
button{border:1px solid var(--line);border-radius:9px;background:var(--raised);min-block-size:44px;padding:7px 14px}
button:hover{border-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
a{color:inherit}
[hidden]{display:none!important}
.preview-wrap{width:min(100% - 36px,1320px);margin-inline:auto}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.preview{font-size:.81rem;color:var(--gold);border:1px solid #655235;border-radius:6px;padding:3px 9px;white-space:nowrap}
 .preview-wrap{padding-block:36px 50px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.85rem,5vw,3.15rem);line-height:1.3;letter-spacing:-.035em}
h2{font-size:1.27rem}
.intro{display:flex;align-items:center;gap:12px;margin-block:0 6px}
.intro svg{color:var(--gold);width:29px;height:29px}
.muted{color:var(--muted)}
.scan{margin-block:22px 28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.controls{display:grid;grid-template-columns:1.15fr 1fr 1fr auto;gap:12px;align-items:end}
label{display:grid;gap:5px;font-size:.86rem;color:var(--muted);min-width:0}
select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding-inline:9px;font-size:.96rem}
.prototype-scan-button{display:flex;align-items:center;justify-content:center;gap:8px;border-color:var(--gold)!important;background:var(--gold)!important;color:#211808!important;font-weight:800;min-height:46px}
.prototype-scan-button:disabled{opacity:.65;cursor:wait}
details{border-top:1px solid var(--line);margin-top:14px;padding-top:9px}
summary{width:fit-content;padding:5px 0;color:var(--muted)}
.extra{padding-top:9px;max-width:350px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,350px);gap:22px;align-items:start}
.preview-panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);min-width:0}
.panel-head{padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-head h2{margin-bottom:3px}
#message{font-size:.87rem;min-height:1.6em}
.filters{display:flex;gap:7px;flex-wrap:wrap;padding:12px 18px}
.filters button{font-size:.82rem}
.filters [aria-pressed=true]{color:var(--gold)!important;border-color:var(--gold)!important;background:#312a1c!important}
.table-label,.result{display:grid;grid-template-columns:1.1fr 1.15fr .8fr 1.15fr .62fr 17px;gap:8px;align-items:center}
.table-label{padding:9px 18px;background:var(--raised);font-size:.79rem;color:var(--muted)}
.result{width:100%;text-align:start;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:12px 18px;min-height:68px;font-size:.86rem}
.result:hover{background:var(--raised)}
.result[aria-current=true]{background:#30291e;box-shadow:inset -3px 0 var(--gold)}
.result:focus-visible{outline-offset:-3px}
.asset{color:var(--ink);font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.chevron{color:var(--gold);font-size:1.1rem}
.status{font-size:.76rem;justify-self:start;border:1px solid var(--line);border-radius:6px;white-space:nowrap;padding:1px 6px}
.observed{color:var(--gold);border-color:#806641}
.pending{color:#c6d6ff;border-color:#596e96}
.confirmed{color:var(--green);border-color:#487363}
.empty{padding:24px 18px;color:var(--muted)}
.inspector{padding:18px}
.inspector h2{margin-block:3px 8px}
.inspector-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#back{display:none}
.levels{margin:14px 0}
.levels div,.source{display:flex;align-items:baseline;justify-content:space-between;gap:9px;border-top:1px solid var(--line);padding:8px 0}
dt,.source{color:var(--muted);font-size:.88rem}
dd{margin:0;font-variant-numeric:tabular-nums;font-weight:700}
.evidence{padding:0 17px 0 0;margin:8px 0 14px;font-size:.88rem}
.evidence li{margin:6px 0;padding-inline-start:4px}
.evidence li::marker{color:var(--gold)}
.footer{margin-top:24px;color:var(--muted);font-size:.79rem}
@media(max-width:920px){.workspace{grid-template-columns:1fr}.controls{grid-template-columns:repeat(2,minmax(0,1fr))} .preview-wrap{padding-top:24px}.inspector:not(.opened){display:none}#back{display:inline-flex;align-items:center;margin-bottom:10px}}
@media(max-width:580px){.preview-wrap{width:calc(100% - 24px)}.scan{padding:12px;margin-block:16px 20px}.controls label:first-child,.prototype-scan-button{grid-column:1/-1}.panel-head,.filters{padding-inline:12px}.table-label{display:none}.result{grid-template-columns:minmax(0,1fr) auto 12px;padding:12px;row-gap:2px}.result .asset{grid-area:1/1}.result .model{grid-area:2/1}.result .frame{grid-area:3/1;color:var(--muted)}.result .status{grid-area:1/2}.result time{grid-area:3/2;color:var(--muted)}.result .chevron{grid-area:1/3/4/4}.inspector{padding:14px}}
}
html[data-theme="light"] #opportunity-preview {
 --bg:#f4eee2;--surface:#fffbf2;--raised:#eee6d8;--line:#c9bead;--ink:#182a2b;--muted:#495e59;--green:#235d48;
 .preview,.observed{color:#79520c;border-color:#a77927}
 .pending{color:#384c79}
 .filters [aria-pressed=true]{color:#624406!important;background:#ffe8ba!important}
 .result[aria-current=true]{color:#624406;background:#ffe8ba}
 .chevron,.intro svg{color:#8a5a05}
 :focus-visible{outline-color:#8a5a05}
}
</style>
</head>
<body>
<header class="header" data-ict-single-header="1" id="ict-one-header"><div class="wrap header-inner"><a aria-label="ICT بالعربي - الرئيسية" class="brand" href="../../#home"><img alt="شعار ICT بالعربي" height="46" src="../../logo-original.jpeg" width="46"/><span><b class="brand-name">ICT بالعربي</b><small class="brand-sub">مساحة المتداول العربي</small></span></a><div class="header-actions" style="margin-inline-start:auto"><button aria-label="تغيير المظهر" class="icon-btn theme-btn" id="theme" title="تغيير المظهر" type="button">◐ <span id="theme-label">تلقائي</span></button></div></div></header>
<main id="opportunity-preview"><div class="preview-wrap">
<svg aria-hidden="true" hidden xmlns="http://www.w3.org/2000/svg"><symbol id="focus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></symbol></svg>
<div class="intro"><svg aria-hidden="true"><use href="#focus"/></svg><h1>مركز فرص التداول</h1></div>
<p class="muted">اختر السوق والأصل والإطار، ثم استعرض النماذج وأدلتها. <span class="preview">بيانات توضيحية</span></p>
<form id="scan" class="scan">
<div class="controls">
<label>السوق<select id="market"><option value="crypto">عقود Bybit USDT</option><option value="fx">الفوركس</option><option value="metal">المعادن</option><option value="index">المؤشرات</option><option value="stock">الأسهم</option></select></label>
<label>الأصل<select id="asset"></select></label>
<label>إطار نموذج الدخول<select id="frame"><option value="all">كل الأطر</option><option value="5">5 دقائق</option><option value="15" selected>15 دقيقة</option><option value="60">ساعة</option><option value="240">أربع ساعات</option></select></label>
<button type="submit" class="prototype-scan-button"><svg aria-hidden="true"><use href="#search"/></svg>فحص السوق</button>
</div>
<details><summary>إعدادات إضافية</summary><div class="extra"><label>نوع النموذج<select id="model"><option value="all">كل النماذج</option><option>Silver Bullet</option><option>2022 Model</option><option>Sweep → MSS → FVG</option><option>OTE</option><option>Breaker Block</option><option>Power of Three</option></select></label></div></details>
</form>
<div class="workspace">
<section class="preview-panel" id="results" aria-labelledby="result-title">
<div class="preview-panel-head"><h2 id="result-title" tabindex="-1">نتائج الفحص</h2><p id="message" class="muted" role="status"></p></div>
<div class="filters" aria-label="حالة الفرصة" role="group">
<button type="button" data-state="all" aria-pressed="true">الكل</button><button type="button" data-state="observed" aria-pressed="false">مرصودة</button><button type="button" data-state="pending" aria-pressed="false">بانتظار التأكيد</button><button type="button" data-state="confirmed" aria-pressed="false">مؤكدة بحثيًا</button>
</div>
<div class="table-label" aria-hidden="true"><span>الأصل</span><span>النموذج</span><span>الإطار</span><span>الحالة</span><span>وقت الرصد</span><span></span></div>
<div id="rows"></div>
</section>
<aside class="preview-panel inspector" id="inspector" aria-labelledby="detail-title">
<button id="back" type="button">العودة للنتائج</button>
<h2 id="detail-title" tabindex="-1">تفاصيل الفرصة</h2>
<div id="detail"><p class="muted">اختر نتيجة لعرض مستوياتها وأدلتها.</p></div>
</aside>
</div>
<p class="footer">معاينة تفاعلية · الأسعار والأوقات أمثلة لتجربة الواجهة.</p>
</div></main>
<script>
'use strict';
const markets={
 crypto:{source:'Bybit · عقود USDT',assets:['BTCUSDT','ETHUSDT','SOLUSDT']},
 fx:{source:'Biquote · فوركس',assets:['EURUSD','GBPUSD']},
 metal:{source:'Biquote · معادن',assets:['XAUUSD','XAGUSD']},
 index:{source:'Biquote · مؤشرات',assets:['NAS100','US30']},
 stock:{source:'Biquote · أسهم',assets:['AAPL','MSFT']}
};
const labels={observed:'مرصودة',pending:'بانتظار التأكيد',confirmed:'مؤكدة بحثيًا'};
const frames={5:'5 دقائق',15:'15 دقيقة',60:'ساعة',240:'أربع ساعات'};
const examples=[
 ['crypto','BTCUSDT',15,'Silver Bullet','confirmed','10:12',['67,420.0','66,980.0','68,560.0'],['سحب سيولة — Sweep','تحوّل هيكل السوق — MSS','فجوة قيمة عادلة — FVG']],
 ['crypto','ETHUSDT',15,'Sweep → MSS → FVG','pending','10:05',['3,420.0','3,394.0','3,480.0'],['سحب سيولة — Sweep','تحوّل هيكل السوق — MSS','بانتظار تأكيد الفجوة']],
 ['crypto','SOLUSDT',15,'2022 Model','observed','09:58',['178.40','177.10','181.30'],['سحب سيولة — Sweep','بانتظار تحوّل هيكل السوق']],
 ['crypto','BTCUSDT',5,'Breaker Block','observed','09:43',['67,325.0','67,200.0','67,680.0'],['كسر منطقة سعرية سابقة']],
 ['fx','EURUSD',60,'OTE','pending','09:00',['1.08420','1.08300','1.08700'],['ارتداد إلى نطاق OTE','بانتظار تأكيد الحركة']],
 ['metal','XAUUSD',240,'Sweep → MSS → FVG','confirmed','08:00',['2,361.5','2,348.0','2,392.0'],['سحب سيولة — Sweep','تحوّل هيكل السوق — MSS','فجوة قيمة عادلة — FVG']],
 ['index','NAS100',15,'Silver Bullet','observed','10:00',['18,240.0','18,185.0','18,370.0'],['سحب سيولة — Sweep']],
 ['stock','AAPL',60,'Power of Three','pending','09:30',['187.20','185.90','190.50'],['رُصد نطاق تجميع','بانتظار تأكيد التوزيع']]
].map(([market,asset,frame,model,state,time,levels,evidence])=>({market,asset,frame,model,state,time,levels,evidence}));
const get=id=>document.getElementById(id);
const filters=[...document.querySelectorAll('[data-state]')];
const narrow=matchMedia('(max-width:920px)');
let results=[],filter='all',selected=null;
function updateAssets(){
 const assets=markets[get('market').value].assets;
 get('asset').replaceChildren(new Option('كل الأصول','all'),...assets.map(asset=>new Option(asset)));
}
function selectResult(result,focus=false){
 selected=result;
 get('inspector').classList.toggle('opened',Boolean(result));
 for(const button of get('rows').querySelectorAll('button')){
  if(button.dataset.id===String(examples.indexOf(result)))button.setAttribute('aria-current','true');
  else button.removeAttribute('aria-current');
 }
 // All displayed values below come from the fixed examples defined above.
 get('detail').innerHTML=result?
  `<div class="inspector-top"><strong class="asset" dir="ltr">${result.asset}</strong><span class="status ${result.state}">${labels[result.state]}</span></div>
  <p class="muted"><bdi>${result.model}</bdi> · ${frames[result.frame]} · <bdi>${result.time}</bdi></p>
  <dl class="levels">${['الدخول المرجعي','الإبطال','الهدف'].map((label,i)=>`<div><dt>${label}</dt><dd dir="ltr">${result.levels[i]}</dd></div>`).join('')}</dl>
  <h3>أدلة النموذج</h3><ol class="evidence">${result.evidence.map(item=>`<li>${item}</li>`).join('')}</ol>
  <div class="source"><span>المصدر في المثال</span><bdi>${markets[result.market].source}</bdi></div>`:
  '<p class="muted">اختر نتيجة لعرض مستوياتها وأدلتها.</p>';
 if(focus)get('detail-title').focus();
}
function renderResults(){
 const visible=results.filter(row=>filter==='all'||row.state===filter);
 get('message').textContent=visible.length?`نتائج توضيحية معروضة · ${visible.length}`:'اكتمل الفحص التوضيحي';
 get('rows').innerHTML=visible.length?visible.map(row=>`<button type="button" class="result" data-id="${examples.indexOf(row)}">
 <strong class="asset" dir="ltr">${row.asset}</strong><bdi class="model">${row.model}</bdi><span class="frame">${frames[row.frame]}</span><span class="status ${row.state}">${labels[row.state]}</span><time dir="ltr">${row.time}</time><span class="chevron" aria-hidden="true">‹</span></button>`).join(''):
 '<p class="empty">لم تظهر نماذج مطابقة. جرّب اختيار أصل أو إطار أو حالة أخرى.</p>';
 selectResult(visible.includes(selected)?selected:narrow.matches?null:visible[0]);
}
function setFilter(value){
 filter=value;
 for(const button of filters)button.setAttribute('aria-pressed',String(button.dataset.state===value));
}
function runScan(){
 const market=get('market').value,asset=get('asset').value,frame=get('frame').value,model=get('model').value;
 results=examples.filter(row=>row.market===market&&(asset==='all'||row.asset===asset)&&(frame==='all'||row.frame===Number(frame))&&(model==='all'||row.model===model));
 selected=null;
 setFilter('all');
 renderResults();
}
get('market').addEventListener('change',updateAssets);
get('scan').addEventListener('submit',event=>{
 event.preventDefault();
 runScan();
 get('result-title').focus();
});
for(const button of filters)button.addEventListener('click',()=>{
 setFilter(button.dataset.state);
 renderResults();
});
get('rows').addEventListener('click',event=>{
 const button=event.target.closest('[data-id]');
 if(button)selectResult(examples[Number(button.dataset.id)],narrow.matches);
});
get('back').addEventListener('click',()=>{
 const button=get('rows').querySelector('[aria-current=true]');
 selectResult(null);
 (button||get('result-title')).focus();
});
updateAssets();
runScan();
</script>
</body>
</html>
